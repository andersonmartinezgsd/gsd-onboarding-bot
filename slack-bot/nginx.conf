# ══════════════════════════════════════════════════════════════════
#  Nginx config para HR Bot en Hostinger VPS
#  Ruta en servidor: /etc/nginx/sites-available/hr-bot
#
#  Después de subir:
#    sudo ln -s /etc/nginx/sites-available/hr-bot /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d bot.gsdoutsources.com
# ══════════════════════════════════════════════════════════════════

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bot.gsdoutsources.com;

    # Certbot necesita este bloque para verificación
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy al bot Node.js
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.gsdoutsources.com;

    # SSL (Certbot los llena automáticamente)
    # ssl_certificate     /etc/letsencrypt/live/bot.gsdoutsources.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bot.gsdoutsources.com/privkey.pem;

    # Seguridad SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy al bot Node.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / keep-alive (necesario para Slack events)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (Slack tiene timeout de 3s para ACK, pero los eventos pueden tardar más)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Tamaño máximo del body (para payloads de Slack con archivos)
        client_max_body_size 10m;
    }

    # Health check — accesible sin autenticación
    location /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    # Logs
    access_log /var/log/nginx/hr-bot.access.log;
    error_log  /var/log/nginx/hr-bot.error.log;
}
